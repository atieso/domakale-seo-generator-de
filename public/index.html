<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Domakalè · SEO Generator DE</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;color:#27312b;background:#f5f6f2}*{box-sizing:border-box}body{margin:0}.shell{max-width:1280px;margin:auto;padding:26px 22px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #ddd;padding-bottom:20px;margin-bottom:24px}h1{font-size:26px;margin:0}.muted{color:#758077;font-size:14px}h2{font-size:18px;margin:0 0 13px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.panel{background:white;border:1px solid #e5e8e2;border-radius:15px;padding:21px;box-shadow:0 3px 15px #243f2510}.panel+.panel{margin-top:14px}textarea,input{width:100%;font:inherit;border:1px solid #cdd5ca;border-radius:9px;padding:11px}textarea{min-height:140px;resize:vertical}.editor{min-height:470px;font:13px/1.5 ui-monospace,Menlo,monospace}button{cursor:pointer;background:#2f5344;border:0;border-radius:9px;color:white;padding:10px 15px;font-weight:650}button.secondary{background:#eef1ec;color:#2f5344;border:1px solid #d6dfd5}button:disabled{opacity:.5;cursor:default}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.item{padding:13px;border:1px solid #e1e6df;border-radius:10px;margin:8px 0;cursor:pointer;background:#fff}.item.active{border-color:#315b45;background:#f2f7f1}.item strong{display:block;font-size:14px}.tag{font-size:11px;display:inline-block;padding:4px 8px;border-radius:12px;background:#ecf0e9;margin-top:6px}.tiny{font-size:12px;color:#6b766d}.preview{background:#f5f7f4;border-radius:12px;padding:18px}.preview h3{margin:0 0 12px}.preview p{line-height:1.7}.error{color:#a33d27;white-space:pre-wrap}.success{color:#2d6242}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.column{min-width:0}@media(max-width:850px){.grid{grid-template-columns:1fr}header{display:block}}
</style></head><body><div class="shell"><header><div><h1>DOMAKALÈ / SEO Generator DE</h1><div class="muted">Modulo 2 · Keyword, bozze AI, revisione ed esportazione Shopify JSON</div></div><div class="muted" id="info">Caricamento…</div></header><div class="grid"><div class="column"><section class="panel"><h2>Importa keyword tedesche</h2><div class="muted">Una keyword per riga, oppure separate da punto e virgola.</div><textarea id="keywords" placeholder="Hotelbettwäsche&#10;Hotelhandtücher&#10;Tischwäsche Gastronomie"></textarea><div class="buttons"><button id="import">Aggiungi keyword</button><button id="reload" class="secondary">Aggiorna</button></div><div id="import-msg" class="tiny"></div></section><section class="panel"><div class="toolbar"><h2>Code e bozze</h2><span id="count" class="tiny"></span></div><div id="items"></div></section></div><div class="column"><section class="panel"><div class="toolbar"><h2 id="heading">Seleziona una keyword</h2><span id="state" class="tag">—</span></div><div id="actions" class="buttons"><button id="generate" disabled>Genera con AI</button><button id="save" class="secondary" disabled>Salva modifiche</button><button id="approve" class="secondary" disabled>Approva</button><button id="export" class="secondary" disabled>Scarica JSON Shopify</button></div><div id="notice" role="status" class="tiny"></div><label for="json"><strong>Payload JSON modificabile</strong></label><textarea id="json" class="editor" spellcheck="false" placeholder="Il contenuto generato apparirà qui..."></textarea><div id="issues" class="error"></div></section><section class="panel"><h2>Anteprima dei contenuti</h2><div id="preview" class="preview muted">Seleziona una bozza generata.</div></section></div></div></div><script>
let rows=[],current=null;const $=id=>document.getElementById(id);
async function api(url,opts={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});let j=await r.json();if(!r.ok)throw Error(j.error||'Errore HTTP '+r.status);return j}
function safeText(el,s){el.textContent=s||'';return el}function node(tag,text){return safeText(document.createElement(tag),text)}
async function load(select=current){rows=await api('/api/drafts');$('count').textContent=rows.length+' voci';let list=$('items');list.replaceChildren();for(let r of [...rows].reverse()){let el=document.createElement('div');el.className='item'+(select===r.id?' active':'');el.append(node('strong',r.keyword),node('span',r.status));el.lastChild.className='tag';el.addEventListener('click',()=>choose(r.id));list.append(el)}if(select&&rows.some(r=>r.id===select))choose(select);else if(rows.length)choose(rows.at(-1).id);else choose(null)}
function choose(id){current=id;const r=rows.find(x=>x.id===id);$('heading').textContent=r?.keyword||'Seleziona una keyword';$('state').textContent=r?.status||'—';$('json').value=r?.content?JSON.stringify(r.content,null,2):'';$('issues').textContent=r?.issues?.length?'Verifiche: '+r.issues.join(' | '):'';for(let k of ['generate','save','approve','export'])$(k).disabled=!r;$('approve').disabled=!r?.content;$('export').disabled=!r?.content;$('notice').textContent='';preview(r?.content);for(let e of document.querySelectorAll('.item'))e.classList.remove('active');let idx=rows.findIndex(x=>x.id===id);let reversed=[...document.querySelectorAll('.item')];if(idx>=0&&reversed[rows.length-1-idx])reversed[rows.length-1-idx].classList.add('active')}
function preview(p){const root=$('preview');root.replaceChildren();if(!p){root.textContent='Nessun contenuto ancora generato';return}root.append(node('h3',p.h1),node('p',p.intro),node('h3',p.body_title),node('p',p.body));for(const c of p.cards||[]){root.append(node('h3',c.heading),node('p',c.text));}root.append(node('h3',p.faq_title));for(const f of p.faqs||[]){root.append(node('strong',f.question),node('p',f.answer))}}
function msg(s,err=false){$('notice').textContent=s;$('notice').className=err?'error':'success'}
$('import').onclick=async()=>{try{let a=await api('/api/import',{method:'POST',body:JSON.stringify({keywords:$('keywords').value})});$('import-msg').textContent=`Importate ${a.added} nuove keyword`;$('keywords').value='';await load()}catch(e){$('import-msg').textContent=e.message}};
$('reload').onclick=()=>load().catch(e=>msg(e.message,true));
$('generate').onclick=async()=>{if(!current)return;$('generate').disabled=true;msg('Generazione AI in corso…');try{let r=await api('/api/generate/'+current,{method:'POST'});await load(r.id);msg(r.issues?.length?'Bozza generata, con verifiche da risolvere':'Bozza generata. Verifica i contenuti prima di approvare.')}catch(e){msg(e.message,true)}finally{$('generate').disabled=false}};
$('save').onclick=async()=>{try{let obj=JSON.parse($('json').value);let r=await api('/api/drafts/'+current,{method:'PUT',body:JSON.stringify({content:obj})});await load(r.id);msg('Modifiche salvate')}catch(e){msg(e.message,true)}};
$('approve').onclick=async()=>{try{let r=await api('/api/approve/'+current,{method:'POST'});await load(r.id);msg(r.status==='approvata'?'Bozza approvata per il successivo invio Shopify':'Correggi i problemi elencati',r.status!=='approvata')}catch(e){msg(e.message,true)}};
$('export').onclick=()=>{if(current)location.href='/api/export/'+current};
api('/api/config').then(c=>{$('info').textContent='Modello: '+c.model+' · Collezioni autorizzate: '+(c.handles.join(', ')||'nessuna')}).catch(e=>msg(e.message,true));load().catch(e=>msg(e.message,true));
</script></body></html>
